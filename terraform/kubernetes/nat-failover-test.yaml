
apiVersion: v1
kind: Pod
metadata:
  name: nat-failover-test
  labels:
    app: nat-failover-test
spec:
  restartPolicy: Never

  nodeSelector:
    topology.kubernetes.io/zone: ap-northeast-2a

  containers:
    - name: curl
      image: curlimages/curl:8.11.1

      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo -n "$(date -u '+%Y-%m-%dT%H:%M:%SZ') "

            curl -4 -sS \
              --connect-timeout 3 \
              --max-time 5 \
              https://checkip.amazonaws.com \
              || echo "FAILED"

            sleep 2
          done
