---
# ==========================================
# ColdGuard On-Premises Variables
# ==========================================

# Tailscale
tailscale_version: "1.104.7"
tailscale_snat_subnet_routes: false

# UFW Firewall
ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_default_routed: deny

ufw_ssh_port: "22"
ufw_tailscale_interface: "tailscale0"

# K3s 네트워크
ufw_k3s_pod_cidr: "10.42.0.0/16"
ufw_k3s_service_cidr: "10.43.0.0/16"

# ==========================================
# K3s
# ==========================================

k3s_version: "v1.37.2+k3s1"

# VMware VM의 기본 네트워크 IPv4 자동 감지
k3s_node_ip: "{{ ansible_default_ipv4.address }}"

# Kubernetes 네트워크
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# K3s 설정
k3s_disable_traefik: false


# ==========================================
# ECR Credential Provider
# ==========================================

ecr_provider_version: "v1.37.0"

ecr_provider_bin_dir: /var/lib/rancher/credentialprovider/bin
ecr_provider_config: /var/lib/rancher/credentialprovider/config.yaml
ecr_credentials_file: /etc/coldguard/ecr-pull/credentials

ecr_region: ap-northeast-2
ecr_cache_duration: "11h"