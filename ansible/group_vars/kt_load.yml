---
# ======================================
# Hostname
# ======================================

kt_load_hostname: "coldguard-prod-kt-load"

# Preserve existing OS hostname by default
kt_load_manage_hostname: false

# ======================================
# Tailscale
# ======================================

kt_load_tailscale_version: "1.104.7"

kt_load_tailscale_repo_url: "https://pkgs.tailscale.com/stable/rhel/8/tailscale.repo"

kt_load_tailscale_tag: "tag:kt-load"

# Enable SSH only during initial Tailnet registration
kt_load_tailscale_enable_ssh: true

kt_load_allow_initial_join: false


# ======================================
# Python
# ======================================

# Load console Python
kt_load_python_path: "/usr/libexec/platform-python"

# Ansible module execution Python
kt_load_ansible_python_package: "python3.12"

ansible_python_interpreter: "/usr/bin/python3.12"


# ======================================
# Service Account
# ======================================

kt_load_user: "coldguard-load"
kt_load_group: "coldguard-load"

kt_load_shell: "/sbin/nologin"
kt_load_home: "/var/lib/coldguard-load"


# ======================================
# Directory
# ======================================

kt_load_deploy_dir: "/opt/coldguard-load"
kt_load_secrets_dir: "/etc/coldguard-load"


# ======================================
# Load Test Tools
# ======================================

# k6
kt_load_k6_binary: "/usr/bin/k6"
kt_load_k6_min_version: "0.49.0"

kt_load_k6_repo_url: "https://dl.k6.io/rpm/repo.rpm"

# emqtt-bench
kt_load_emqtt_version: "0.6.2"

kt_load_emqtt_install_dir: "/opt/emqtt-bench"
kt_load_emqtt_binary: "/opt/emqtt-bench/bin/emqtt_bench"

kt_load_emqtt_archive: "emqtt-bench-{{ kt_load_emqtt_version }}-el8-amd64.tar.gz"

kt_load_emqtt_download_url: "https://github.com/emqx/emqtt-bench/releases/download/{{ kt_load_emqtt_version }}/{{ kt_load_emqtt_archive }}"

kt_load_emqtt_sha256: "01555f5d149d17084da49ae3bc15fa9c57f304962c827ba73330b61a7f992eea"


# ======================================
# Secret Files
# ======================================

kt_load_api_key_file: "{{ kt_load_secrets_dir }}/api.key"

kt_load_mqtt_password_file: "{{ kt_load_secrets_dir }}/mqtt.pw"

kt_load_mqtt_ca_file: "{{ kt_load_secrets_dir }}/mqtt-ca.crt"


# ======================================
# Load Console
# ======================================

kt_load_console_file: "load_console.py"

kt_load_console_source: "{{ playbook_dir }}/../files/load_console.py"

kt_load_console_service: "coldguard-load-console"

kt_load_nofile: 65536

kt_load_restart_sec: 5


# ======================================
# Network Ports
# ======================================

kt_load_bind_address: "127.0.0.1"

kt_load_console_http_port: 8090
kt_load_console_https_port: 443

kt_load_dashboard_http_port: 5665
kt_load_dashboard_https_port: 5665


# ======================================
# Tailscale Serve Backend
# ======================================

kt_load_console_backend_url: "http://{{ kt_load_bind_address }}:{{ kt_load_console_http_port }}/"

kt_load_dashboard_backend_url: "http://{{ kt_load_bind_address }}:{{ kt_load_dashboard_http_port }}/"
