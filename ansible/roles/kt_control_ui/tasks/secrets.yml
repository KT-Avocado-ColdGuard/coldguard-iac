---
# ==========================================
# Validate Control UI Secrets
# ==========================================

- name: Validate Control UI secret variables
  ansible.builtin.assert:
    that:
      - kt_ui_api_key is defined
      - kt_ui_api_key is string
      - kt_ui_api_key | trim | length > 0
      - "'\n' not in kt_ui_api_key"
      - "'\r' not in kt_ui_api_key"
      - kt_ui_accounts is defined
      - kt_ui_accounts is mapping
      - "'cloud' in kt_ui_accounts"
      - "'monitoring' in kt_ui_accounts"
      - (kt_ui_accounts.keys() | list | difference(['cloud', 'monitoring', 'security']) | length) == 0
    fail_msg: "Required Control UI secrets are missing or invalid"
  no_log: true

- name: Validate account password hashes
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value is match('^scrypt:.+')
  loop: "{{ kt_ui_accounts | dict2items }}"
  no_log: true


# ==========================================
# Deploy Control UI API Key
# ==========================================

- name: Deploy Control UI API key
  ansible.builtin.copy:
    content: "{{ kt_ui_api_key | trim }}\n"
    dest: "{{ kt_ui_secrets_dir }}/api-key"
    owner: "{{ kt_ui_uid }}"
    group: "{{ kt_ui_gid }}"
    mode: "0600"
  no_log: true
  diff: false


# ==========================================
# Deploy Control UI Accounts
# ==========================================

- name: Deploy Control UI accounts file
  ansible.builtin.copy:
    content: "{{ kt_ui_accounts | to_nice_json }}\n"
    dest: "{{ kt_ui_secrets_dir }}/accounts.json"
    owner: "{{ kt_ui_uid }}"
    group: "{{ kt_ui_gid }}"
    mode: "0600"
  no_log: true
  diff: false
