---
# ======================================
# 1. Vault Variables Verification
# ======================================

- name: Verify required Vault variables
  ansible.builtin.assert:
    that:
      - (kt_load_api_key | default('') | trim | length) > 0
      - (kt_load_mqtt_password | default('') | trim | length) > 0
      - (kt_load_mqtt_ca | default('') | trim | length) > 0
    fail_msg: "Required secret is missing from Vault"

  no_log: true


# ======================================
# 2. OpenSSL Installation
# ======================================

- name: Install OpenSSL only when missing
  ansible.builtin.raw: |
    set -eu

    if ! rpm -q openssl >/dev/null 2>&1; then
      dnf install -y openssl
      echo KT_CHANGED
    fi

  register: kt_load_openssl_run
  changed_when: "'KT_CHANGED' in kt_load_openssl_run.stdout"


# ======================================
# 3. API Key Configuration
# ======================================

- name: Deploy Control API key
  ansible.builtin.copy:
    content: "{{ kt_load_api_key }}"
    dest: "{{ kt_load_api_key_file }}"
    owner: root
    group: "{{ kt_load_group }}"
    mode: "0640"
    backup: false

  no_log: true
  diff: false


# ======================================
# 4. MQTT Password Configuration
# ======================================

- name: Deploy MQTT password
  ansible.builtin.copy:
    content: "{{ kt_load_mqtt_password }}"
    dest: "{{ kt_load_mqtt_password_file }}"
    owner: root
    group: "{{ kt_load_group }}"
    mode: "0640"
    backup: false

  no_log: true
  diff: false


# ======================================
# 5. MQTT CA Certificate
# ======================================

- name: Deploy MQTT CA certificate
  ansible.builtin.copy:
    content: "{{ kt_load_mqtt_ca }}"
    dest: "{{ kt_load_mqtt_ca_file }}"
    owner: root
    group: "{{ kt_load_group }}"
    mode: "0644"
    backup: false
    validate: "/usr/bin/openssl x509 -in %s -noout"

  no_log: true
  diff: false


# ======================================
# 6. Secret Files Verification
# ======================================

- name: Verify secret file ownership and permissions
  ansible.builtin.raw: |
    set -eu

    path={{ item.path | quote }}

    expected={{ ('root:' ~ kt_load_group ~ ':' ~ item.mode) | quote }}

    test ! -L "$path"

    test -f "$path"

    test -s "$path"

    test "$(stat -c '%U:%G:%a' "$path")" = "$expected"

    echo "$path: OK"

  loop:

    - path: "{{ kt_load_api_key_file }}"
      mode: "640"

    - path: "{{ kt_load_mqtt_password_file }}"
      mode: "640"

    - path: "{{ kt_load_mqtt_ca_file }}"
      mode: "644"

  loop_control:
    label: "{{ item.path }}"

  changed_when: false


# ======================================
# 7. Service Account Access Verification
# ======================================

- name: Verify service account access to secret files
  ansible.builtin.raw: |
    set -eu

    path={{ item | quote }}

    # Service account must be able to read
    runuser -u {{ kt_load_user | quote }} -- test -r "$path"

    # Service account must not be able to write
    if runuser -u {{ kt_load_user | quote }} -- test -w "$path"; then
      echo "Unexpected write permission: $path"
      exit 1
    fi

    echo "$path: read-only access OK"

  loop:
    - "{{ kt_load_api_key_file }}"
    - "{{ kt_load_mqtt_password_file }}"
    - "{{ kt_load_mqtt_ca_file }}"

  changed_when: false


# ======================================
# 8. Certificate Verification
# ======================================

- name: Verify MQTT CA certificate
  ansible.builtin.raw: |
    set -eu

    openssl x509 \
      -in {{ kt_load_mqtt_ca_file | quote }} \
      -noout \
      -checkend 0

    echo "MQTT CA certificate: OK"

  changed_when: false
