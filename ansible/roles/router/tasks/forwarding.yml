---
# ==========================================
# IPv6 Forwarding 설정
# ==========================================

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: true
    sysctl_file: "{{ router_sysctl_file }}"
    reload: true