---
# ==========================================
# ColdGuard AWS Router Configuration
# ==========================================

# 필수 패키지 설치
- name: Install required packages
  ansible.builtin.import_tasks: install.yml

# IPv4 / IPv6 Forwarding 설정
- name: Configure IP forwarding
  ansible.builtin.import_tasks: forwarding.yml

# Tailscale 연결 및 라우팅 설정
- name: Configure Tailscale
  ansible.builtin.import_tasks: tailscale.yml

# KT Hub Probe 파일 배치 및 서비스 설정
- name: Configure KT Hub probe
  ansible.builtin.import_tasks: probe.yml

# Router 설정 검증
- name: Verify router configuration
  ansible.builtin.import_tasks: verify.yml