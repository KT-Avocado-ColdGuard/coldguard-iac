---
# ==========================================
# Tailscale 설치 여부 확인
# ==========================================

- name: Check Tailscale installation
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: router_tailscale_binary


# ==========================================
# Tailscale 설치
# ==========================================

- name: Install Tailscale
  when: not router_tailscale_binary.stat.exists
  block:

    - name: Download Tailscale repository key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale repository
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true


# ==========================================
# Tailscale 서비스 활성화
# ==========================================

- name: Enable and start Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started


# ======================================
# Check AWS CLI Installation
# ======================================

- name: Check AWS CLI installation
  ansible.builtin.stat:
    path: "{{ router_aws_cli_binary }}"
  register: router_aws_cli_stat

- name: Check installed AWS CLI version
  ansible.builtin.command:
    cmd: "{{ router_aws_cli_binary }} --version"
  register: router_aws_cli_check
  changed_when: false
  when: router_aws_cli_stat.stat.exists


# ======================================
# Install AWS CLI
# ======================================

- name: Install AWS CLI from official ZIP
  when: >
    not router_aws_cli_stat.stat.exists or
    ('aws-cli/' ~ router_aws_cli_version ~ ' ')
    not in (router_aws_cli_check.stdout | default(''))
  block:

    - name: Install unzip package
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Create temporary installation directory
      ansible.builtin.tempfile:
        state: directory
        suffix: awscli
      register: router_aws_cli_tmp

    - name: Download AWS CLI installer
      ansible.builtin.get_url:
        url: "{{ router_aws_cli_url }}"
        dest: "{{ router_aws_cli_tmp.path }}/awscliv2.zip"
        mode: "0644"

    - name: Extract AWS CLI installer
      ansible.builtin.unarchive:
        src: "{{ router_aws_cli_tmp.path }}/awscliv2.zip"
        dest: "{{ router_aws_cli_tmp.path }}"
        remote_src: true

    - name: Install or update AWS CLI
      ansible.builtin.command:
        argv:
          - "{{ router_aws_cli_tmp.path }}/aws/install"
          - --install-dir
          - "{{ router_aws_cli_install_dir }}"
          - --bin-dir
          - "{{ router_aws_cli_bin_dir }}"
          - --update

  always:

    - name: Remove temporary installation directory
      ansible.builtin.file:
        path: "{{ router_aws_cli_tmp.path }}"
        state: absent
      when:
        - router_aws_cli_tmp is defined
        - router_aws_cli_tmp.path is defined




