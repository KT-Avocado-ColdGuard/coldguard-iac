---
# ==========================================
# ColdGuard On-Premises Setup
# ==========================================

- name: ColdGuard On-Premises Setup
  hosts: onprem
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml

  roles:
    - common
    - tailscale
    - firewall
    - k3s

- name: Configure ColdGuard AWS Router
  hosts: aws_router
  connection: ssh
  become: true
  gather_facts: true

  roles:
    - router