# Argo CD Helm values (차트 10.15.0 / Argo CD 3.6.1)
#
# 구성 원칙
#   - 단일 구성(HA 아님): 노드 3대 규모에서 HA는 과합니다.
#   - ApplicationSet 끔: 시설별 구성은 Ansible로 찍어 내므로 쓰지 않습니다.
#   - Dex 끔: GitHub 로그인은 쓰지 않습니다. 사람별 접근은 로컬 계정과 RBAC로 나눕니다.
#   - 화면 접속: Tailscale Ingress(coldguard-gitops infra/aws)가 TLS를 처리하므로 서버는 HTTP로 둡니다.
#   - 알림: 배포 결과를 Discord Webhook으로 보냅니다.

server:
  service:
    # 외부 LoadBalancer 없이 Tailscale로만 접속합니다.
    type: ClusterIP

# 이 차트는 ApplicationSet 컨트롤러를 항상 만들므로 0개로 실행해 끕니다.
applicationSet:
  replicas: 0

# EKS의 Prometheus Agent가 application-controller 지표(8082)를 수집할 수 있도록 metrics Service를 만듭니다.
controller:
  metrics:
    enabled: true

dex:
  enabled: false

configs:
  params:
    # TLS는 Tailscale Ingress 프록시가 처리합니다.
    server.insecure: true

  cm:
    # 조회 전용 로컬 계정 (CI/CD 담당). 비밀번호는 설치 후 argocd CLI로 정합니다.
    accounts.cicd: login

  rbac:
    # 계정에 역할이 없으면 아무 권한도 주지 않습니다.
    policy.default: ""
    policy.csv: |
      g, cicd, role:readonly

notifications:
  enabled: true

  # Webhook URL은 Git과 Terraform State에 남지 않도록 차트가 Secret을 만들지 않게 하고,
  # argocd-notifications-secret을 kubectl로 직접 만듭니다(discord-webhook-url 키).
  secret:
    create: false

  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
        - name: Content-Type
          value: application/json

  # 이미지 레지스트리와 임의 오류 원문은 알림에 넣지 않습니다.
  templates:
    template.app-deployed: |
      webhook:
        discord:
          method: POST
          body: |
            {{- $op := default (dict) .app.status.operationState -}}
            {{- $ok := and (eq .app.status.sync.status "Synced") (eq .app.status.health.status "Healthy") (eq $op.phase "Succeeded") -}}
            {{- $title := "ℹ️ 중앙 배포 알림 형식 확인" -}}
            {{- $state := "실제 배포 완료 조건이 아닙니다. 수동 시험 발송 여부를 확인해 주세요." -}}
            {{- if $ok -}}
            {{- $title = "✅ 중앙 배포 완료" -}}
            {{- $state = "배포 설정 반영 완료 / 앱 정상" -}}
            {{- end -}}
            {"content": {{ printf "## %s\n\n- 대상: %s\n- 상태: %s\n- 배포 설정 커밋 SHA: `%s`\n- 이미지: %s\n- Argo CD: <%s/applications/argocd/%s>\n\n※ 앱 정상 여부는 Kubernetes 상태 기준이며, 실제 업무 기능은 별도로 확인합니다." $title .app.metadata.name $state .app.status.sync.revision (regexReplaceAll `[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/` (join ", " .app.status.summary.images) "") .context.argocdUrl .app.metadata.name | toJson }}, "allowed_mentions": {"parse": []}}
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {{- $op := default (dict) .app.status.operationState -}}
            {{- $sync := default (dict) $op.syncResult -}}
            {{- $phase := default "" $op.phase -}}
            {{- $title := "ℹ️ 중앙 배포 실패 알림 형식 확인" -}}
            {{- $reason := "현재 배포 실패 상태가 아닙니다. 수동 시험 발송 여부를 확인해 주세요." -}}
            {{- if eq $phase "Failed" -}}
            {{- $title = "❌ 중앙 배포 실패" -}}
            {{- $reason = "배포 설정 적용에 실패했습니다. Argo CD 실행 상세에서 실패한 리소스를 확인해 주세요." -}}
            {{- else if eq $phase "Error" -}}
            {{- $title = "❌ 중앙 배포 실패" -}}
            {{- $reason = "배포 작업 중 오류가 발생했습니다. 저장소 접근과 배포 설정을 Argo CD 실행 상세에서 확인해 주세요." -}}
            {{- end -}}
            {"content": {{ printf "## %s\n\n- 대상: %s\n- 배포 시도 커밋 SHA: `%s`\n- 사유: %s\n- Argo CD: <%s/applications/argocd/%s>" $title .app.metadata.name (default .app.status.sync.revision $sync.revision) $reason .context.argocdUrl .app.metadata.name | toJson }}, "allowed_mentions": {"parse": []}}
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {{- $health := .app.status.health.status -}}
            {{- $title := "ℹ️ 중앙 앱 상태 알림 형식 확인" -}}
            {{- $state := "현재 앱은 상태 이상 알림 대상이 아닙니다. 수동 시험 발송 여부를 확인해 주세요." -}}
            {{- if eq $health "Degraded" -}}
            {{- $title = "❗ 중앙 앱 상태 이상" -}}
            {{- $state = "앱 상태 저하 / 일부 리소스의 정상 실행을 확인할 수 없음" -}}
            {{- else if eq $health "Healthy" -}}
            {{- $state = "앱 정상 — 상태 이상이 발생한 것이 아닙니다." -}}
            {{- end -}}
            {"content": {{ printf "## %s\n\n- 대상: %s\n- 상태: %s\n- 이미지: %s\n- Argo CD: <%s/applications/argocd/%s>" $title .app.metadata.name $state (regexReplaceAll `[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/` (join ", " .app.status.summary.images) "") .context.argocdUrl .app.metadata.name | toJson }}, "allowed_mentions": {"parse": []}}

  triggers:
    # 동기화가 끝나고 Healthy가 됐을 때 커밋마다 한 번
    trigger.on-deployed: |
      - description: Application is synced and healthy. Triggered once per commit.
        oncePer: app.status.operationState?.syncResult?.revision
        send: [app-deployed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.sync.status == 'Synced' and app.status.health.status == 'Healthy' and app.status.operationState.syncResult.revision == app.status.sync.revision
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send: [app-sync-failed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: Application has degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'

  # 모든 Application에 적용합니다.
  subscriptions:
    - recipients:
        - discord
      triggers:
        - on-deployed
        - on-sync-failed
        - on-health-degraded
